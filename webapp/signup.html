<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Food Ordering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #ffe4d6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
            background-color: white;
            padding: 35px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: bold;
            color: #e65100;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #e65100;
            box-shadow: 0 0 0 2px rgba(230, 81, 0, 0.1);
        }

        .form-group textarea {
            height: 80px;
            resize: none;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background-color: #e65100;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background-color: #bf4400;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-text a {
            color: #e65100;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .signup-container {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">Foodie</div>

        <div class="subtitle">
            Create your account and start ordering
        </div>

        <form action="signup" method="post">

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="username"
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phoneNumber"
                    placeholder="Enter your phone number"
                    required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create your password"
                    required>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Delivery Address</label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your delivery address"
                    required></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</body>

</html>
